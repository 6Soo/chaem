name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/deployment-ready-impl-8plv4u]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # dist를 gh-pages 브랜치로 배포 — gh-pages 브랜치가 생기면
      # GitHub이 Pages를 자동 활성화한다 (안 되면 Settings > Pages에서
      # Source: Deploy from a branch / gh-pages 선택, 최초 1회)
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
